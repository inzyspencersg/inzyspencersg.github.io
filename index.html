<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>INZY Closure Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap">
<style>

:root{--bg:#fff;--panel:#fff;--panel2:#FFF8DC;--line:#EFE8D0;--ink:#2B2200;--soft:#5C5235;--mute:#756C4E;--gold:#FFE071;--gold-ink:#2B2200;--bar:#D8CDA3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}
header{padding:8px 0 16px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:28px;line-height:1.15;margin:6px 0 4px}
.asat{color:var(--soft);font-size:14px}
.cd{margin-top:16px;background:linear-gradient(135deg,#1C2C57,#16244A);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.cd-lbl{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.cd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-u{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.cd-u b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd-u span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.cd.done .cd-row{display:none}
.race{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.race .ln{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;font-size:14px;line-height:1.35}
.race-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.race .k{min-width:104px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.race .v{color:var(--soft)}
.race .v b{color:var(--gold)}
.race .v .it{white-space:nowrap}
.race .v .sep{color:var(--mute);margin:0 2px}
@media (max-width:520px){.race .ln{grid-template-columns:1fr;gap:2px}}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:var(--panel);color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.card .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--soft);vertical-align:middle;margin-left:6px}
.pill.live{background:#2C4A2E;color:#BFE3B4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .stat{padding:10px 10px}
.trio .stat .v{font-size:16px}
.trio .stat .k{font-size:10px}
.trio .stat .d{font-size:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-size:19px;font-weight:700;margin-top:4px;line-height:1.2}
.stat .d{font-size:13px;color:var(--soft);margin-top:2px}
.nil{color:var(--mute)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:22px minmax(84px,120px) 1fr auto;align-items:center;gap:10px}
.row .n{color:var(--mute);font-size:13px;text-align:right}
.row .who{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--bar);border-radius:6px}
.row.top .bar i{background:var(--gold)} .row.top .who{color:var(--gold)}
.row .amt{font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt small{display:block;color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--panel2);border-radius:999px;padding:4px;margin:0 0 14px}
.seg button{flex:1 1 0;min-width:0;white-space:nowrap;background:none;border:0;color:var(--soft);padding:8px 6px;border-radius:999px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold-ink)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.zero td{color:var(--mute)}
tr.tot td{font-weight:700;color:var(--gold);border-bottom:0}
td.name{font-weight:700}
.scroll{overflow-x:auto}
details.week{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
details.week summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
details.week summary::-webkit-details-marker{display:none}
details.week summary .t{font-weight:700;font-size:16px}
details.week summary .t span{color:var(--mute);font-weight:500;font-size:13px;margin-left:6px}
details.week summary .p{color:var(--gold);font-weight:700;font-size:14px}
details.week summary .w{grid-column:1 / -1;color:var(--soft);font-size:13px}
details.week[open] summary{border-bottom:1px solid var(--line)}
.wbody{padding:12px 16px 16px}
.day{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dd{color:var(--mute)}
.day b{font-weight:700}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal .h{font-size:10px;color:var(--mute);text-align:center;text-transform:uppercase}
.cal .c{min-height:46px;background:var(--panel2);border-radius:8px;padding:4px 3px;font-size:10px;line-height:1.15;overflow:hidden}
.cal .c .dn{color:var(--mute);font-size:10px}
.cal .c .wn{font-weight:700;color:var(--ink);font-size:10px;letter-spacing:-.2px;margin-top:2px;white-space:nowrap;overflow:hidden}
.cal .c.quiet{opacity:.45}
.cal .c.blank{background:none}
.cal .c.today{outline:2px solid var(--gold)}
.legend{font-size:12px;color:var(--mute);margin:0 0 6px}
details.records{margin-top:26px}
details.records>summary{cursor:pointer;color:var(--soft);font-weight:700;padding:12px 0}
.note{color:var(--soft);font-size:14px;line-height:1.55}
.note b{color:var(--ink)}
footer{color:var(--mute);font-size:12px;margin-top:20px}
@media (max-width:520px){
  h1{font-size:24px}
  .row{grid-template-columns:18px 84px 1fr auto;gap:8px}
  .day{grid-template-columns:62px 1fr 1fr}
  .hide-sm{display:none}
}

body{font-weight:500}
.wrap{max-width:720px;padding:14px 16px 64px}
header{padding:4px 0 12px}
.hd{position:relative;display:block;width:max-content;max-width:100%;font-size:clamp(1.95rem,8.7vw,3.5rem)}
h1.big{margin:8px 0 8px;font-weight:900;font-size:inherit;line-height:1;letter-spacing:-.04em;word-spacing:.08em;text-transform:uppercase;white-space:nowrap}
h1.big em{font-style:normal;display:inline-block;background:var(--gold);line-height:.86;padding:.08em .14em .1em;margin:.1em 0 0 -.02em;border-radius:.2em}
.tro{position:absolute;right:-.05em;top:-.62em;width:1.42em;height:auto;transform:rotate(9deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.eyebrow{color:var(--ink);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none}
.asat{color:var(--mute);margin-top:2px}
.cd{margin-top:14px;background:var(--gold);border:0;border-radius:24px;padding:14px}
.cd-lbl{color:var(--ink);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;margin:0 2px 10px}
.cd-u{background:#fff;border-radius:16px;padding:12px 2px 10px}
.cd-u b{font-size:clamp(1.9rem,8.6vw,2.6rem);font-weight:900;letter-spacing:-.04em}
.cd-u span{color:var(--soft);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;margin-top:4px}
nav{padding:10px 0 12px;gap:5px}
nav button{flex:1 1 auto;background:#fff;color:var(--soft);border:1.5px solid var(--line);padding:11px 10px;font-weight:600}
nav button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
nav button:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{border:1.5px solid var(--line);border-radius:24px;padding:18px 16px}
.card h2{font-size:1.65rem;font-weight:900;letter-spacing:-.03em;word-spacing:.08em;line-height:1.05;text-transform:uppercase;color:var(--ink);margin:0 0 4px}
.card .sub{font-size:14px}
.pill{background:var(--panel2);color:var(--ink);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;padding:4px 10px;vertical-align:.3em;margin-left:8px}
.pill.live{background:var(--ink);color:var(--gold)}
.stat{border-radius:18px;padding:13px 14px}
.stat .k{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none}
.stat .v{font-size:1.5rem;font-weight:900;letter-spacing:-.035em;margin-top:6px;line-height:1.1}
.stat .v.nil{color:var(--mute)}
.trio .stat .k{font-size:12px}.trio .stat .v{font-size:1.05rem;letter-spacing:-.02em}
.cl{background:var(--panel2);border:0;padding:14px 16px;margin-bottom:12px}
.race{margin:0;gap:9px}
.race-h{font-size:1.2rem;font-weight:900;letter-spacing:-.025em;word-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:0}
.race .ln{font-size:14px}
.race .k{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mute)}
.race .v{color:var(--soft)}
.race .v b{color:var(--ink);font-weight:800;background:var(--gold);padding:0 .3em;border-radius:5px}
.row .bar{background:var(--panel2)}
.row.top .bar i{background:#F5C518}.row.top .who{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
th{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
tr.tot td{color:var(--ink)}
details.week{border:1.5px solid var(--line);border-radius:20px}
details.week summary .t{font-weight:800}
details.week summary .p{color:var(--ink)}
details.week summary .t span.pill.live{color:var(--gold);font-size:12px;font-weight:600;margin-left:8px}
.cal .c{border-radius:10px}.cal .c.today{outline-color:var(--ink)}
.lbl{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
.cal .h{text-transform:none}
details.records>summary{color:var(--ink)}
</style>
<style>
h1.big{font-weight:800;letter-spacing:-.03em;text-transform:uppercase}
.hd{font-size:calc(clamp(1.95rem,8.7vw,3.5rem)*0.92)}
.card h2,.stat .v,.cd-u b{font-weight:800;letter-spacing:-.03em}
.card h2{font-size:1.7rem;text-transform:uppercase}
.cd-u b{font-variant-numeric:tabular-nums}

.league{background:var(--ink);border-radius:24px;padding:6px;margin-bottom:10px;color:#fff}
.lg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 10px 7px}
.lg-t{font-weight:800;font-size:.95rem;letter-spacing:-.01em;text-transform:uppercase;word-spacing:.06em;color:#fff}
.lg-tag{flex:none;background:var(--gold);color:var(--ink);font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.lg-hero{background:var(--gold);color:var(--ink);border-radius:18px;padding:9px 14px 10px}
.lg-k{font-size:13px;font-weight:600}
.lg-main{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lg-fig{font-weight:800;font-size:clamp(2.3rem,10.5vw,3rem);line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg-who{font-size:14px;font-weight:600;text-align:right;min-width:0}
.lg-sw{display:flex;gap:3px;padding:6px 2px 3px}
.lg-sw button{flex:1;appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:#D9CFAE;padding:7px 2px;border-radius:99px;cursor:pointer;transition:background .18s,color .18s}
.lg-sw button[aria-pressed=true]{background:#fff;color:var(--ink)}
.lg-sw button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.lg-list{list-style:none;margin:0;padding:0 10px 3px}
.lg-list li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.lg-list li+li{border-top:1px solid rgba(255,255,255,.12)}
.lg-r{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:#4A3D12;color:#fff}
.lg-n{flex:1;min-width:0;font-weight:600;line-height:1.25}
.lg-amt{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.lg-hero>*,.lg-list{animation:lgin .22s ease both}
@keyframes lgin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lg-hero>*,.lg-list{animation:none}.lg-sw button{transition:none}}
/* tighter top of page and summary cards, so Today and This week stay on screen */
header{padding:0 0 6px}
.cd{margin-top:8px;border-radius:20px;padding:10px}
.cd-lbl{margin:0 2px 7px}
.cd-u{border-radius:13px;padding:7px 2px 6px}
.cd-u b{font-size:clamp(1.55rem,7vw,2.2rem)}
.cd-u span{margin-top:2px}
nav{padding:7px 0 8px}
nav button{padding:8px 10px}
#now .card{padding:11px 14px 12px;margin-bottom:10px;border-radius:20px}
#now .card h2{font-size:1.2rem}
#now .card .pill{vertical-align:.12em;padding:2px 9px}
#now .card .sub{font-size:13px;margin:0 0 7px}
#now .stat{padding:7px 12px 8px;border-radius:14px}
#now .stat .k{font-size:12.5px}
#now .stat .v{font-size:1.15rem;margin-top:1px}
#now .stat .d:empty{display:none}
#now .duo{margin-bottom:0!important}
#now .card>p:last-child,#now .card>.empty{margin:7px 0 0;font-size:13px}
</style><style>

</style></head>
<body>
<div class="wrap">

const $ = s => document.querySelector(s);
const START = new Date(D.window.start + "T00:00:00");
const dt = s => new Date(s + "T00:00:00");
const dayNo = s => Math.round((dt(s) - START) / 864e5) + 1;
const fmtD = (s, o) => dt(s).toLocaleDateString("en-GB", o || {weekday:"short", day:"numeric", month:"short"});
const short = s => dt(s).toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const money = (v, dp) => "$" + Number(v || 0).toLocaleString("en-US", {minimumFractionDigits: dp ? 2 : 0, maximumFractionDigits: 2});
const rp = v => money(v, Math.round(v) !== Number(v));
const cs = v => (Math.round(v * 10) / 10).toString();
const names = a => a && a.length ? a.join(" & ") : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthName = k => new Date(k + "-01T00:00:00").toLocaleDateString("en-GB", {month:"long"});
const wkNum = k => k.replace("W", "");

const today = D.days[D.days.length - 1];
const lastFinal = [...D.days].reverse().find(d => !d.provisional);
const curWeek = D.weeks[D.weeks.length - 1];
const curMonth = D.months[D.months.length - 1];

$("#asat").textContent = `As at ${fmtD(D.as_at, {weekday:"short", day:"numeric", month:"short", year:"numeric"})} · Day ${dayNo(D.as_at)} · Week ${wkNum(curWeek.key)}`;

/* ---------- shared pieces ---------- */
function bars(lb, opts) {
  opts = opts || {};
  const rows = lb.slice(0, opts.top || lb.length);
  if (!rows.length) return `<p class="nil">No cases yet.</p>`;
  const max = Math.max(...rows.map(r => r[1])) || 1;
  const rk = ranks(rows.map(r => r[1]));
  return `<div class="rows">` + rows.map((r, i) => `
    <div class="row ${r[1] === max && r[1] > 0 ? "top" : ""}">
      <span class="n">${rk[i]}</span><span class="who">${esc(r[0])}</span>
      <span class="bar"><i style="width:${Math.max(2, r[1] / max * 100)}%"></i></span>
      <span class="amt">${rp(r[1])}<small>${cs(r[2])} case${r[2] == 1 ? "" : "s"}${opts.earn ? " · " + money(opts.earn[r[0]] || 0) + " earned" : ""}</small></span>
    </div>`).join("") + `</div>`;
}
function winnerStat(label, w, unit) {
  const who = names(w.winners);
  return `<div class="stat"><div class="k">${label}</div>
    <div class="v ${who ? "" : "nil"}">${who ? esc(who) : "NIL"}</div>
    <div class="d">${who ? unit(w) : ""}</div></div>`;
}
function dayStat(d, label) {
  const f = d.first_case, m = d.most_cases;
  const fw = names(f.winners), mw = names(m.winners);
  const pay = p => { const v = Object.values(p || {}); return v.length ? " · " + (v.length > 1 ? money(v[0]) + " each" : money(v[0])) : ""; };
  return `<div class="duo">
    <div class="stat"><div class="k">1st case</div><div class="v ${fw ? "" : "nil"}">${fw ? esc(fw) : "NIL"}</div>
      <div class="d">${fw ? (f.at ? f.at.replace(/^0/, "") : "") + pay(f.pay) : ""}</div></div>
    <div class="stat"><div class="k">Most cases</div><div class="v ${mw ? "" : "nil"}">${mw ? esc(mw) : "NIL"}</div>
      <div class="d">${mw ? cs(m.count) + " case" + (m.count == 1 ? "" : "s") + pay(m.pay) : ""}</div></div>
  </div>`;
}
const CAL = {"Jun Kai":"Jun Kai","Shawn Tan":"Shawn","Natalie Loh":"Natalie","Anita Ee":"Anita"};
const ranks = vals => vals.map(v => vals.filter(x => x > v).length + 1);
function trio(p) {
  return `<div class="trio" style="margin-bottom:14px">${winnerStat("Biggest case", p.biggest, w => rp(w.rp))}${winnerStat("Aggregate RP", p.aggregate, w => rp(w.rp))}${winnerStat("Most cases", p.most, w => cs(w.count) + " case" + (w.count == 1 ? "" : "s"))}</div>`;
}
const prizeLine = (p, amt) => p.most && p.most.prize ? `$${amt} + $${amt} + $${amt}` : `$${amt} + $${amt} · most cases shown for recognition`;
const toMap = arr => Object.fromEntries((arr || []).map(x => [x[0], x[1]]));

/* ---------- Now ---------- */
(function () {

/* ---------- Leaderboard ---------- */
(function () {
  const views = {week: {label: `Week ${wkNum(curWeek.key)}`, title: `Week ${wkNum(curWeek.key)}`, lb: curWeek.leaderboard, earn: toMap(curWeek.earnings), sub: `${short(curWeek.start)} – ${short(curWeek.end)}`}};
  for (const m of D.months) views[m.key] = {   // one tab per month, added automatically as each month starts
    label: monthName(m.key).slice(0, 3), title: monthName(m.key), lb: m.leaderboard,
    earn: Object.fromEntries(D.agents.map(a => [a, (D.monthly_rewards[a] || {})[m.key] || 0])),
    sub: `${short(m.start)} – ${short(m.end)}${m.provisional ? " · so far" : ""}`, period: m};
  views.all = {label: "Overall", title: "Overall", lb: D.final.leaderboard, earn: toMap(D.payouts), sub: "8 Sept – 31 Dec", period: D.final};
  function render(k) {
    const v = views[k];
    const seen = new Set(v.lb.map(r => r[0]));
    const rows = v.lb.concat(D.agents.filter(a => !seen.has(a)).map(a => [a, 0, 0]));
    const rk = ranks(rows.map(r => r[1]));
    const body = rows.map((r, i) => `<tr class="${r[1] ? "" : "zero"}"><td class="name">${r[1] ? rk[i] + ". " : ""}${esc(r[0])}</td>

      <div class="card"><h2>${v.title}</h2><p class="sub">${v.sub} · ranked by aggregate RP</p>${v.period ? trio(v.period) : ""}
      <div class="scroll"><table><tr><th>Agent</th><th>RP</th><th>Cases</th><th>Earned</th></tr>${body}</table></div></div>`;
    $("#board").querySelectorAll(".seg button").forEach(b => b.onclick = () => render(b.dataset.v));
  }
  render(curWeek.leaderboard.length ? "week" : "all");
})();

    for (let i = 0; i < lead; i++) h += `<div class="c blank"></div>`;
    for (let dd = 1; dd <= n; dd++) {
      const key = `${m}-${String(dd).padStart(2, "0")}`, d = byDate[key];
      if (!d) { h += `<div class="c blank"></div>`; continue; }
      const w = names(d.first_case.winners);
      h += `<div class="c ${w ? "" : "quiet"} ${key === D.as_at ? "today" : ""}"><div class="dn">${dd}</div>${d.first_case.winners.map(x => `<div class="wn">${esc(CAL[x] || x)}</div>`).join("")}</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  for (const w of [...D.weeks].reverse()) {
    const days = D.days.filter(d => d.date >= w.start && d.date <= w.end);
    const bw = names(w.biggest.winners), aw = names(w.aggregate.winners);
    const earn = (w.earnings || []).map(e => `${esc(e[0])} ${money(e[1])}`).join(" · ");
    h += `<details class="week"><summary>
        <span class="t">Week ${wkNum(w.key)}<span>${short(w.start)} – ${short(w.end)}</span>${w.provisional ? '<span class="pill live">Live</span>' : ""}</span>
        <span class="p">${w.provisional ? "" : money(w.payout) + " paid"}</span>
        <span class="w">Biggest: ${bw ? esc(bw) + " " + rp(w.biggest.rp) : "NIL"} · Aggregate: ${aw ? esc(aw) + " " + rp(w.aggregate.rp) : "NIL"}</span>
      </summary><div class="wbody">
      <div class="lbl" style="margin-top:0">Daily</div>
      <div class="day"><span class="dd lbl" style="margin:0">Day</span><span class="lbl" style="margin:0">1st case</span><span class="lbl" style="margin:0">Most cases</span></div>
      ${days.map(d => `<div class="day"><span class="dd">${fmtD(d.date, {weekday:"short", day:"numeric"})}</span>
         <span>${names(d.first_case.winners) ? "<b>" + esc(names(d.first_case.winners)) + "</b>" : '<span class="nil">NIL</span>'}</span>
         <span>${names(d.most_cases.winners) ? "<b>" + esc(names(d.most_cases.winners)) + "</b> (" + cs(d.most_cases.count) + ")" : '<span class="nil">NIL</span>'}</span></div>`).join("")}
      <div class="lbl">Aggregate RP</div>${bars(w.leaderboard, {earn: toMap(w.earnings)})}
      ${earn ? `<div class="lbl">Earned this week</div><div class="note">${earn}</div>` : ""}
      </div></details>`;
  }
  $("#results").innerHTML = h;
})();

document.querySelectorAll("#results .cal").forEach(c => {
  const cells = [...c.querySelectorAll(".c")];
  for (let i = 0; i < cells.length; i += 7) { const r = cells.slice(i, i + 7); if (r.every(x => x.classList.contains("blank"))) r.forEach(x => x.remove()); }
});

/* ---------- Earnings ---------- */
(function () {
  const ms = D.reward_months.filter(m => m <= D.as_at.slice(0, 7));
  const rows = D.agents.map(a => {
    const per = ms.map(m => (D.monthly_rewards[a] || {})[m] || 0);
    return [a, per, per.reduce((x, y) => x + y, 0)];
  }).sort((x, y) => y[2] - x[2]);
  const tot = ms.map((_, i) => rows.reduce((s, r) => s + r[1][i], 0));
  const grand = tot.reduce((x, y) => x + y, 0);
  $("#earn").innerHTML = `<div class="card"><h2>Incentives earned</h2><p class="sub">By the month each prize falls in · ${money(grand)} paid so far</p>
    <div class="scroll"><table><tr><th>Agent</th>${ms.map(m => `<th>${monthName(m).slice(0, 3)}</th>`).join("")}<th>Total</th></tr>
    ${rows.map(r => `<tr class="${r[2] ? "" : "zero"}"><td class="name">${esc(r[0])}</td>${r[1].map(v => `<td>${v ? money(v) : "–"}</td>`).join("")}<td><b>${money(r[2])}</b></td></tr>`).join("")}
    <tr class="tot"><td>All agents</td>${tot.map(v => `<td>${money(v)}</td>`).join("")}<td>${money(grand)}</td></tr></table></div></div>`;
})();

/* ---------- Full records ---------- */
(function () {
  const led = [...D.ledger].reverse().map(x => `<tr><td>${x.date.length > 7 ? short(x.date) : monthName(x.date)}</td><td style="text-align:left">${esc(x.prize)}</td><td style="text-align:left">${esc(x.agent)}</td><td>${money(x.amount)}</td></tr>`).join("");
  const cases = [...D.cases].reverse().map(c => `<tr><td>${short(c.date)}</td><td style="text-align:left">${esc(c.fsc || "")}</td><td>${rp(c.rp)}</td><td>${cs(c.cases)}</td></tr>`).join("");
  $("#records").innerHTML = `
    <div class="card"><h2>How it's counted</h2><div class="note">
      <b>Daily:</b> $30 first case of the day + $30 most cases of the day.<br>
      <b>Weekly</b> (Mon–Sun): $80 biggest case + $80 highest aggregate RP.<br>
      <b>Monthly:</b> $150 biggest case + $150 highest aggregate RP + $150 most cases (most cases paid from November, counting cases from 2 Nov). Months run in whole weeks: Sept 8 Sept – 4 Oct, Oct 5 Oct – 1 Nov, Nov 2 Nov – 6 Dec, Dec 7 – 31 Dec.<br><b>Final</b> (8 Sept – 31 Dec): $500 biggest case + $500 highest aggregate RP + $500 most cases.<br>
      SP counts at 10% of RP. A case shared between names on the FSC line splits RP and case count evenly. Tied winners split the prize. A case scores on the day it is posted.</div></div>
    <div class="card"><h2>Prize ledger</h2><div class="scroll"><table><tr><th style="text-align:left">Date</th><th style="text-align:left">Prize</th><th style="text-align:left">Agent</th><th>Amount</th></tr>${led}</table></div></div>
    <div class="card"><h2>Case log</h2><div class="scroll"><table><tr><th style="text-align:left">Date</th><th style="text-align:left">FSC</th><th>RP</th><th>Cases</th></tr>${cases}</table></div></div>`;
})();

/* ---------- countdown to the final day (Singapore time) ---------- */
(function () {
  const END = new Date("2026-12-31T23:59:59+08:00").getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const ms = END - Date.now();
    if (ms <= 0) { $("#cd").classList.add("done"); $("#cd .cd-lbl").textContent = "Challenge complete · final results below"; return; }
    const s = Math.floor(ms / 1000);
    $("#cd-d").textContent = Math.floor(s / 86400);
    $("#cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
    $("#cd-m").textContent = pad(Math.floor(s % 3600 / 60));
    $("#cd-s").textContent = pad(s % 60);
    setTimeout(tick, 1000 - Date.now() % 1000);
  }
  tick();
})();

/* ---------- race for the final prizes: Champions League ---------- */
(function () {
  const lb = D.final.leaderboard;
  if (!lb.length) return;
  const caseWord = n => cs(n) + (n === 1 ? " case" : " cases");
  const rpRows = [...lb].sort((a, b) => b[1] - a[1]).map(r => ({who: r[0], v: Math.round(r[1]), show: money(Math.round(r[1]))}));
  const caseRows = [...lb].sort((a, b) => b[2] - a[2] || b[1] - a[1]).map(r => ({who: r[0], v: r[2], show: caseWord(r[2])}));
  const bigRows = D.cases.filter(c => c.cases > 0 && c.rp > 0 && c.agents && c.agents.length)
                     .sort((a, b) => b.rp - a.rp).map(c => ({who: c.agents.join(" & "), v: Math.round(c.rp), show: money(Math.round(c.rp))}));
  const V = {
    agg: {k: "Aggregate RP", btn: "Aggregate", prize: D.prizes.final_agg, rows: rpRows},
    big: {k: "Biggest case", btn: "Biggest case", prize: D.prizes.final_big, rows: bigRows},
    most: {k: "Most cases", btn: "Most cases", prize: D.prizes.final_cases, rows: caseRows}
  };
  $("#race").innerHTML = `<div class="lg-top"><span class="lg-t">Champions League</span><span class="lg-tag" id="lg-tag"></span></div>
    <div class="lg-hero" id="lg-hero"></div>
    <div class="lg-sw">${Object.keys(V).map(p => `<button type="button" data-p="${p}" aria-pressed="false">${V[p].btn}</button>`).join("")}</div>
    <ol class="lg-list" id="lg-list"></ol>`;
  function show(p) {
    const {k, prize, rows} = V[p];
    document.querySelectorAll(".lg-sw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p));
    $("#lg-tag").textContent = money(prize) + " prize";
    if (!rows.length) {
      $("#lg-hero").innerHTML = `<div class="lg-k">${k}</div><div class="lg-main"><div class="lg-fig">NIL</div><div class="lg-who">No cases yet</div></div>`;
      $("#lg-list").innerHTML = "";
      return;
    }
    const leaders = rows.filter(r => r.v === rows[0].v).map(r => r.who);
    const rank = r => rows.filter(x => x.v > r.v).length + 1;
    const joint = leaders.length > 1 || leaders[0].includes(" & ");
    $("#lg-hero").innerHTML = `<div class="lg-k">${k}</div><div class="lg-main"><div class="lg-fig">${rows[0].show}</div><div class="lg-who">${esc(leaders.join(" & "))} ${joint ? "are" : "is"} No. 1</div></div>`;
    $("#lg-list").innerHTML = rows.filter(r => r.v !== rows[0].v).slice(0, 2).map(r => `<li><span class="lg-r" aria-hidden="true">${rank(r)}</span><span class="lg-n">${esc(r.who)}</span><span class="lg-amt">${r.show}</span></li>`).join("");
    ["lg-hero", "lg-list"].forEach(id => { const e = document.getElementById(id); [e, ...e.children].forEach(n => { n.style.animation = "none"; n.offsetWidth; n.style.animation = ""; }); });
  }
  document.querySelectorAll(".lg-sw button").forEach(b => b.onclick = () => show(b.dataset.p));
  show("agg");
})();

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === b.dataset.t));
  window.scrollTo({top: 0});
});
</script>
</body>
</html>
