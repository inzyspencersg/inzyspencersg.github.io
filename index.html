<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>INZY Closure Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --bg:#0F1A31; --panel:#16244A; --panel2:#1C2C57; --line:#2A3B66;
  --ink:#F4F1E8; --soft:#B9C3D9; --mute:#7F8BA8; --gold:#E8B84B; --gold-ink:#14213D;
  --bar:#5F79B0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}
header{padding:8px 0 16px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:28px;line-height:1.15;margin:6px 0 4px}
.asat{color:var(--soft);font-size:14px}
.cd{margin-top:16px;background:linear-gradient(135deg,#1C2C57,#16244A);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.cd-lbl{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.cd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-u{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.cd-u b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd-u span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.cd.done .cd-row{display:none}
.race{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.race .ln{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;font-size:14px;line-height:1.35}
.race-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.race .k{min-width:104px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.race .v{color:var(--soft)}
.race .v b{color:var(--gold)}
.race .v .it{white-space:nowrap}
.race .v .sep{color:var(--mute);margin:0 2px}
@media (max-width:520px){.race .ln{grid-template-columns:1fr;gap:2px}}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:var(--panel);color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.card .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--soft);vertical-align:middle;margin-left:6px}
.pill.live{background:#2C4A2E;color:#BFE3B4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .stat{padding:10px 10px}
.trio .stat .v{font-size:16px}
.trio .stat .k{font-size:10px}
.trio .stat .d{font-size:12px}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-size:19px;font-weight:700;margin-top:4px;line-height:1.2}
.stat .d{font-size:13px;color:var(--soft);margin-top:2px}
.nil{color:var(--mute)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:22px minmax(84px,120px) 1fr auto;align-items:center;gap:10px}
.row .n{color:var(--mute);font-size:13px;text-align:right}
.row .who{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--bar);border-radius:6px}
.row.top .bar i{background:var(--gold)} .row.top .who{color:var(--gold)}
.row .amt{font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt small{display:block;color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--panel2);border-radius:999px;padding:4px;margin:0 0 14px}
.seg button{flex:1 1 0;min-width:0;white-space:nowrap;background:none;border:0;color:var(--soft);padding:8px 6px;border-radius:999px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--gold-ink)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.zero td{color:var(--mute)}
tr.tot td{font-weight:700;color:var(--gold);border-bottom:0}
td.name{font-weight:700}
.scroll{overflow-x:auto}
details.week{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
details.week summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
details.week summary::-webkit-details-marker{display:none}
details.week summary .t{font-weight:700;font-size:16px}
details.week summary .t span{color:var(--mute);font-weight:500;font-size:13px;margin-left:6px}
details.week summary .p{color:var(--gold);font-weight:700;font-size:14px}
details.week summary .w{grid-column:1 / -1;color:var(--soft);font-size:13px}
details.week[open] summary{border-bottom:1px solid var(--line)}
.wbody{padding:12px 16px 16px}
.day{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dd{color:var(--mute)}
.day b{font-weight:700}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal .h{font-size:10px;color:var(--mute);text-align:center;text-transform:uppercase}
.cal .c{min-height:46px;background:var(--panel2);border-radius:8px;padding:4px 3px;font-size:10px;line-height:1.15;overflow:hidden}
.cal .c .dn{color:var(--mute);font-size:10px}
.cal .c .wn{font-weight:700;color:var(--ink);font-size:10px;letter-spacing:-.2px;margin-top:2px;white-space:nowrap;overflow:hidden}
.cal .c.quiet{opacity:.45}
.cal .c.blank{background:none}
.cal .c.today{outline:2px solid var(--gold)}
.legend{font-size:12px;color:var(--mute);margin:0 0 6px}
details.records{margin-top:26px}
details.records>summary{cursor:pointer;color:var(--soft);font-weight:700;padding:12px 0}
.note{color:var(--soft);font-size:14px;line-height:1.55}
.note b{color:var(--ink)}
footer{color:var(--mute);font-size:12px;margin-top:20px}
@media (max-width:520px){
  h1{font-size:24px}
  .row{grid-template-columns:18px 84px 1fr auto;gap:8px}
  .day{grid-template-columns:62px 1fr 1fr}
  .hide-sm{display:none}
}
</style>
</head>

const $ = s => document.querySelector(s);
const START = new Date(D.window.start + "T00:00:00");
const dt = s => new Date(s + "T00:00:00");
const dayNo = s => Math.round((dt(s) - START) / 864e5) + 1;
const fmtD = (s, o) => dt(s).toLocaleDateString("en-GB", o || {weekday:"short", day:"numeric", month:"short"});
const short = s => dt(s).toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const money = (v, dp) => "$" + Number(v || 0).toLocaleString("en-US", {minimumFractionDigits: dp ? 2 : 0, maximumFractionDigits: 2});
const rp = v => money(v, Math.round(v) !== Number(v));
const cs = v => (Math.round(v * 10) / 10).toString();
const names = a => a && a.length ? a.join(" & ") : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthName = k => new Date(k + "-01T00:00:00").toLocaleDateString("en-GB", {month:"long"});
const wkNum = k => k.replace("W", "");

const today = D.days[D.days.length - 1];
const lastFinal = [...D.days].reverse().find(d => !d.provisional);
const curWeek = D.weeks[D.weeks.length - 1];

$("#asat").textContent = `As at ${fmtD(D.as_at, {weekday:"short", day:"numeric", month:"short", year:"numeric"})} · Day ${dayNo(D.as_at)} · Week ${wkNum(curWeek.key)}`;

/* ---------- shared pieces ---------- */
function bars(lb, opts) {
  opts = opts || {};
  const rows = lb.slice(0, opts.top || lb.length);
  if (!rows.length) return `<p class="nil">No cases yet.</p>`;
  const max = Math.max(...rows.map(r => r[1])) || 1;
  const rk = ranks(rows.map(r => r[1]));
  return `<div class="rows">` + rows.map((r, i) => `
    <div class="row ${r[1] === max && r[1] > 0 ? "top" : ""}">
      <span class="n">${rk[i]}</span><span class="who">${esc(r[0])}</span>
      <span class="bar"><i style="width:${Math.max(2, r[1] / max * 100)}%"></i></span>
      <span class="amt">${rp(r[1])}<small>${cs(r[2])} case${r[2] == 1 ? "" : "s"}${opts.earn ? " · " + money(opts.earn[r[0]] || 0) + " earned" : ""}</small></span>
    </div>`).join("") + `</div>`;
}
function winnerStat(label, w, unit) {
  const who = names(w.winners);
  return `<div class="stat"><div class="k">${label}</div>
    <div class="v ${who ? "" : "nil"}">${who ? esc(who) : "NIL"}</div>
    <div class="d">${who ? unit(w) : "&nbsp;"}</div></div>`;
}
function dayStat(d, label) {
  const f = d.first_case, m = d.most_cases;
  const fw = names(f.winners), mw = names(m.winners);
  const pay = p => { const v = Object.values(p || {}); return v.length ? " · " + (v.length > 1 ? money(v[0]) + " each" : money(v[0])) : ""; };
  return `<div class="duo">
    <div class="stat"><div class="k">1st case</div><div class="v ${fw ? "" : "nil"}">${fw ? esc(fw) : "NIL"}</div>
      <div class="d">${fw ? (f.at ? f.at.replace(/^0/, "") : "") + pay(f.pay) : "&nbsp;"}</div></div>
    <div class="stat"><div class="k">Most cases</div><div class="v ${mw ? "" : "nil"}">${mw ? esc(mw) : "NIL"}</div>
      <div class="d">${mw ? cs(m.count) + " case" + (m.count == 1 ? "" : "s") + pay(m.pay) : "&nbsp;"}</div></div>
  </div>`;
}
const CAL = {"Jun Kai":"Jun Kai","Shawn Tan":"Shawn","Natalie Loh":"Natalie","Anita Ee":"Anita"};
const ranks = vals => vals.map(v => vals.filter(x => x > v).length + 1);
function trio(p) {
  return `<div class="trio" style="margin-bottom:14px">${winnerStat("Biggest case", p.biggest, w => rp(w.rp))}${winnerStat("Aggregate RP", p.aggregate, w => rp(w.rp))}${winnerStat("Most cases", p.most, w => cs(w.count) + " case" + (w.count == 1 ? "" : "s"))}</div>`;
}
const prizeLine = (p, amt) => p.most && p.most.prize ? `$${amt} + $${amt} + $${amt}` : `$${amt} + $${amt} · most cases shown for recognition`;

/* ---------- Now ---------- */
(function () {

(function () {

  for (const m of D.months) views[m.key] = {   // one tab per month, added automatically as each month starts
    label: monthName(m.key).slice(0, 3), title: monthName(m.key), lb: m.leaderboard,
    earn: Object.fromEntries(D.agents.map(a => [a, (D.monthly_rewards[a] || {})[m.key] || 0])),

  function render(k) {
    const v = views[k];
    const seen = new Set(v.lb.map(r => r[0]));
    const rows = v.lb.concat(D.agents.filter(a => !seen.has(a)).map(a => [a, 0, 0]));
    const rk = ranks(rows.map(r => r[1]));
    const body = rows.map((r, i) => `<tr class="${r[1] ? "" : "zero"}"><td class="name">${r[1] ? rk[i] + ". " : ""}${esc(r[0])}</td>

})();

    for (let dd = 1; dd <= n; dd++) {
      const key = `${m}-${String(dd).padStart(2, "0")}`, d = byDate[key];
      if (!d) { h += `<div class="c blank"></div>`; continue; }
      const w = names(d.first_case.winners);

      <div class="day"><span class="dd lbl" style="margin:0">Day</span><span class="lbl" style="margin:0">1st case</span><span class="lbl" style="margin:0">Most cases</span></div>
      ${days.map(d => `<div class="day"><span class="dd">${fmtD(d.date, {weekday:"short", day:"numeric"})}</span>
         <span>${names(d.first_case.winners) ? "<b>" + esc(names(d.first_case.winners)) + "</b>" : '<span class="nil">NIL</span>'}</span>
         <span>${names(d.most_cases.winners) ? "<b>" + esc(names(d.most_cases.winners)) + "</b> (" + cs(d.most_cases.count) + ")" : '<span class="nil">NIL</span>'}</span></div>`).join("")}
      <div class="lbl">Aggregate RP</div>${bars(w.leaderboard, {earn: toMap(w.earnings)})}
      ${earn ? `<div class="lbl">Earned this week</div><div class="note">${earn}</div>` : ""}
      </div></details>`;
  }
  $("#results").innerHTML = h;
})();

/* ---------- Earnings ---------- */
(function () {
  const ms = D.reward_months.filter(m => m <= D.as_at.slice(0, 7));
  const rows = D.agents.map(a => {
    const per = ms.map(m => (D.monthly_rewards[a] || {})[m] || 0);
    return [a, per, per.reduce((x, y) => x + y, 0)];
  }).sort((x, y) => y[2] - x[2]);
  const tot = ms.map((_, i) => rows.reduce((s, r) => s + r[1][i], 0));
  const grand = tot.reduce((x, y) => x + y, 0);
  $("#earn").innerHTML = `<div class="card"><h2>Incentives earned</h2><p class="sub">By the month each prize falls in · ${money(grand)} paid so far</p>
    <div class="scroll"><table><tr><th>Agent</th>${ms.map(m => `<th>${monthName(m).slice(0, 3)}</th>`).join("")}<th>Total</th></tr>
    ${rows.map(r => `<tr class="${r[2] ? "" : "zero"}"><td class="name">${esc(r[0])}</td>${r[1].map(v => `<td>${v ? money(v) : "–"}</td>`).join("")}<td><b>${money(r[2])}</b></td></tr>`).join("")}
    <tr class="tot"><td>All agents</td>${tot.map(v => `<td>${money(v)}</td>`).join("")}<td>${money(grand)}</td></tr></table></div></div>`;
})();

/* ---------- Full records ---------- */
(function () {
  const led = [...D.ledger].reverse().map(x => `<tr><td>${x.date.length > 7 ? short(x.date) : monthName(x.date)}</td><td style="text-align:left">${esc(x.prize)}</td><td style="text-align:left">${esc(x.agent)}</td><td>${money(x.amount)}</td></tr>`).join("");
  const cases = [...D.cases].reverse().map(c => `<tr><td>${short(c.date)}</td><td style="text-align:left">${esc(c.fsc || "")}</td><td>${rp(c.rp)}</td><td>${cs(c.cases)}</td></tr>`).join("");
  $("#records").innerHTML = `
    <div class="card"><h2>How it's counted</h2><div class="note">
      <b>Daily:</b> $30 first case of the day + $30 most cases of the day.<br>
      <b>Weekly</b> (Mon–Sun): $80 biggest case + $80 highest aggregate RP.<br>
      <b>Monthly:</b> $150 biggest case + $150 highest aggregate RP + $150 most cases (most cases paid from November, counting cases from 2 Nov).<br><b>Final</b> (8 Sept – 31 Dec): $500 biggest case + $500 highest aggregate RP + $500 most cases.<br>
      SP counts at 10% of RP. A case shared between names on the FSC line splits RP and case count evenly. Tied winners split the prize. A case scores on the day it is posted.</div></div>
    <div class="card"><h2>Prize ledger</h2><div class="scroll"><table><tr><th style="text-align:left">Date</th><th style="text-align:left">Prize</th><th style="text-align:left">Agent</th><th>Amount</th></tr>${led}</table></div></div>
    <div class="card"><h2>Case log</h2><div class="scroll"><table><tr><th style="text-align:left">Date</th><th style="text-align:left">FSC</th><th>RP</th><th>Cases</th></tr>${cases}</table></div></div>`;
})();

/* ---------- countdown to the final day (Singapore time) ---------- */
(function () {
  const END = new Date("2026-12-31T23:59:59+08:00").getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const ms = END - Date.now();
    if (ms <= 0) { $("#cd").classList.add("done"); $("#cd .cd-lbl").textContent = "Challenge complete · final results below"; return; }
    const s = Math.floor(ms / 1000);
    $("#cd-d").textContent = Math.floor(s / 86400);
    $("#cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
    $("#cd-m").textContent = pad(Math.floor(s % 3600 / 60));
    $("#cd-s").textContent = pad(s % 60);
    setTimeout(tick, 1000 - Date.now() % 1000);
  }
  tick();
})();

/* ---------- race for the final prizes, inside the countdown box ---------- */
(function () {
  const lb = D.final.leaderboard;
  if (!lb.length) return;
  const fmt = rows => rows.slice(0, 3).map((r, i) => `<span class="it">${i === 0 ? `<b>${esc(r[0])}</b>` : esc(r[0])} ${r[1]}</span>`).join(' <span class="sep">·</span> ');
  const byRp = [...lb].sort((a, b) => b[1] - a[1]).map(r => [r[0], money(Math.round(r[1]))]);
  const byCases = [...lb].sort((a, b) => b[2] - a[2] || b[1] - a[1]).map(r => [r[0], cs(r[2])]);
  const big = D.cases.filter(c => c.cases > 0 && c.rp > 0 && c.agents && c.agents.length)
                     .sort((a, b) => b.rp - a.rp).map(c => [c.agents.join(" & "), money(Math.round(c.rp))]);
  $("#race").innerHTML = `<div class="race-h">🏆 Champions League</div>
    <div class="ln"><span class="k">Aggregate RP</span><span class="v">${fmt(byRp)}</span></div>
    <div class="ln"><span class="k">Biggest case</span><span class="v">${fmt(big)}</span></div>
    <div class="ln"><span class="k">Most cases</span><span class="v">${fmt(byCases)}</span></div>`;
})();

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === b.dataset.t));
  window.scrollTo({top: 0});
});
</script>
</body>
</html>
